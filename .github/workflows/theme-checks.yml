name: Theme checks
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Check PHP syntax and compile styles
        run: bash scripts/cloud-setup.sh
